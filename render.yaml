services:
  - type: web
    name: atlas-travel-route-planning
    env: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
