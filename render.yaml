services:
  - type: web
    name: atlas-travel-route-planning
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.
    
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PORT
        value: "8000"
